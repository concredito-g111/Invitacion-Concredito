/* brillitos */
.sp{position:absolute;width:var(--s);height:var(--s);transform:translate(-50%,-50%);pointer-events:none;
background:radial-gradient(circle,#fff 0,#ffe9a0 30%,transparent 70%);
clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);
filter:drop-shadow(0 0 4px #ffd76a);animation:tw var(--d) ease-in-out infinite alternate;animation-delay:var(--l)}
@keyframes tw{from{opacity:.15;transform:translate(-50%,-50%) scale(.4) rotate(0)}to{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(45deg)}}
.snow{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.fl{position:absolute;top:-20px;color:#fff;text-shadow:0 0 8px #fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
/* interfaz */
.ui{position:absolute;left:12%;right:12%;top:53%;bottom:4.5%;display:flex;flex-direction:column;justify-content:space-between;z-index:3}
.glass{background:linear-gradient(rgba(12,24,60,.84),rgba(5,10,30,.9));border:max(1px,.35cqw) solid var(--gold);border-radius:2.4cqw;
box-shadow:0 0 3cqw rgba(241,205,122,.3),inset 0 0 2cqw rgba(241,205,122,.12);backdrop-filter:blur(3px)}
.cd{padding:1.3cqw 1cqw 1.5cqw;text-align:center}
.cd p{margin:0 0 .6cqw;font:italic 600 3.3cqw/1.1 'Cormorant Garamond',serif;color:var(--gold)}
.tm{display:grid;grid-template-columns:repeat(4,1fr)}
.u{border-left:1px solid rgba(241,205,122,.45)}.u:first-child{border:0}
.u b{display:block;font:700 6.6cqw/1.05 Cinzel,Georgia,serif;color:#ffe6a0;text-shadow:0 0 2cqw rgba(255,200,90,.7)}
.u span{font:600 1.8cqw Cinzel,serif;letter-spacing:.14em;text-transform:uppercase;color:#e9d7a5}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5cqw}
.info .glass{padding:1.2cqw .6cqw;text-align:center;color:var(--cream);font:700 2.5cqw/1.15 'Cormorant Garamond',serif}
.info i{display:block;font-style:normal;font-size:4.6cqw;line-height:1.2;filter:drop-shadow(0 0 1cqw rgba(255,200,90,.6))}
.guest{text-align:center;font:italic 700 3cqw/1.1 'Cormorant Garamond',serif;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 4px #000}
.acts{display:grid;gap:1.5cqw}
.b{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;cursor:pointer;color:#fff;
border:max(1px,.4cqw) solid var(--gold);border-radius:2.2cqw;box-shadow:0 .8cqw 2cqw rgba(0,0,0,.5);transition:transform .2s,filter .2s}
.b:hover{transform:translateY(-2px);filter:brightness(1.12)}
.b::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sh 4s infinite}
@keyframes sh{0%,60%{left:-60%}100%{left:130%}}
.main{height:8cqw;gap:1.5cqw;font:700 3cqw Cinzel,serif;letter-spacing:.03em;background:linear-gradient(#22a152,#0b6030);animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 .8cqw 2cqw rgba(0,0,0,.5),0 0 0 rgba(60,220,120,0)}50%{box-shadow:0 .8cqw 2cqw rgba(0,0,0,.5),0 0 3cqw rgba(60,220,120,.7)}}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5cqw}
.row .b{height:9cqw;flex-direction:column;gap:.2cqw;font:700 2.4cqw/1.1 'Cormorant Garamond',serif;padding:0 .6cqw}
.row .b i{font-style:normal;font-size:3.6cqw;line-height:1}
.no{background:linear-gradient(#b8283a,#6e1020)}.mp{background:linear-gradient(#1b7fc4,#0c3f78)}.cal{background:linear-gradient(#ffe9a0,#d9a93e);color:#4d3008}
.st{position:absolute;left:0;right:0;bottom:1.6cqw;text-align:center;font:600 2.4cqw Arial,sans-serif;color:#ffe6a0;z-index:4;text-shadow:0 1px 3px #000}
@media(prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>

$("confirmBtn").href=wa("¡Hola! Confirmo con mucho gusto mi asistencia al Brindis Decembrino de ConCrédito. ¡ AGREGA TU NOMBRE, y GRUPO AL QUE PERTENECES EN OTRO MENSAJE !"+guest+gt+". ¡Nos vemos!");
$("declineBtn").href=wa("Hola, muchas gracias por la invitación al Brindis Decembrino de ConCrédito. Lamentablemente no podré asistir. Nombre: "+guest+gt+".");
$("mapBtn").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(CONFIG.place);
const S=new Date(CONFIG.start),E=new Date(CONFIG.end);
function tick(){const n=new Date(),c=$("cd");
 if(n>=E){c.innerHTML="<p>¡Gracias por celebrar con nosotros!</p>";return}
 if(n>=S){c.innerHTML="<p>🎄 ¡La celebración ya comenzó! 🎄</p>";return}
 const d=S-n,v={days:Math.floor(d/864e5),hours:Math.floor(d%864e5/36e5),minutes:Math.floor(d%36e5/6e4),seconds:Math.floor(d%6e4/1e3)};
 for(const k in v)$(k).textContent=String(v[k]).padStart(2,"0")}
tick();setInterval(tick,1000);
const ics=d=>{const z=n=>String(n).padStart(2,"0");return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"T"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds())};
$("calendarBtn").addEventListener("click",()=>{
 const t=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//ConCredito//Brindis//ES","BEGIN:VEVENT","UID:concredito-brindis-2026@example.com","DTSTART:"+ics(S),"DTEND:"+ics(E),"SUMMARY:Brindis Decembrino ConCrédito","LOCATION:"+CONFIG.place,"DESCRIPTION:¡Que la magia de la Navidad nos una para celebrar juntos!","END:VEVENT","END:VCALENDAR"].join("\r\n");
 const u=URL.createObjectURL(new Blob([t],{type:"text/calendar;charset=utf-8"})),a=document.createElement("a");
 a.href=u;a.download="Brindis-ConCredito.ics";a.click();URL.revokeObjectURL(u);
 $("status").textContent="¡Tu evento está listo para agregar al calendario!"});
// brillitos: sobre las estrellas de la imagen + aleatorios
const card=$("card");
const fixed=[[73.7,11.7],[77.8,55.8],[36.8,82],[16.5,37],[86,22],[9,52],[27,20],[62,60],[20,75]];
const pts=fixed.concat(Array.from({length:26},()=>[Math.random()*100,Math.random()*100]));
pts.forEach(([x,y],i)=>{const s=document.createElement("i");s.className="sp";
 s.style.cssText=`left:${x}%;top:${y}%;--s:${i<fixed.length?4.5+Math.random()*2:1.5+Math.random()*2.5}cqw;--d:${1+Math.random()*2}s;--l:${-Math.random()*3}s`;card.appendChild(s)});
// nieve
const sn=$("snow"),n=matchMedia("(max-width:600px)").matches?26:44;
for(let i=0;i<n;i++){const f=document.createElement("span");f.className="fl";f.textContent=Math.random()>.5?"❄":"✦";
 f.style.cssText=`left:${Math.random()*100}%;font-size:${8+Math.random()*12}px;animation-duration:${8+Math.random()*12}s;animation-delay:${-Math.random()*20}s`;sn.appendChild(f)}
</script>
</body>
